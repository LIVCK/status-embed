<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>status-embed demo</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fafafa; color: #18181b; transition: background .2s, color .2s; }
    html.dark body { background: #0f0f12; color: #fafafa; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid #e4e4e7; }
    html.dark header { border-color: #27272a; }
    header input { flex: 1; min-width: 260px; padding: 8px 10px; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; background: transparent; color: inherit; }
    button { padding: 8px 12px; border: 1px solid #d4d4d8; border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    main { padding: 24px; display: grid; gap: 28px; max-width: 1000px; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #71717a; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    footer { padding: 18px 24px; border-top: 1px solid #e4e4e7; display: flex; gap: 18px; align-items: center; font-size: 14px; }
    html.dark footer { border-color: #27272a; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <input id="host" aria-label="Status page" placeholder="status.example.com">
    <button id="theme" type="button">Dunkel / Hell</button>
    <button id="lang" type="button">DE / EN</button>
  </header>
  <main id="main"></main>
  <footer>
    <span>© Acme</span><a href="#">Impressum</a>
    <livck-status class="live" variant="inline"></livck-status>
  </footer>
  <script>
    // Demo page: every embed variant against one status page (?host=…), page theme and language switchable.
    const params = new URLSearchParams(location.search)
    const host = params.get('host') || 'http://localhost:13002'
    document.getElementById('host').value = host
    document.getElementById('host').addEventListener('change', e => { params.set('host', e.target.value); location.search = params })
    document.getElementById('theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'))
    document.getElementById('lang').addEventListener('click', () => {
      document.documentElement.lang = document.documentElement.lang === 'de' ? 'en' : 'de'
    })
    const groups = [
      ['Badge', [{}, { icon: 'livi' }, { size: 'sm' }, { size: 'lg' }, { 'powered-by': '' }]],
      ['Button', [{ variant: 'button' }, { variant: 'button', icon: 'livi', target: '_self' }]],
      ['Punkt', [{ variant: 'dot' }, { variant: 'dot', size: 'lg' }, { variant: 'dot', icon: 'livi', size: 'lg' }]],
      ['Im Text', [{ variant: 'inline' }]],
      ['Eigene Farben und Radius', [{ 'color-operational': '#7c3aed', 'color-operational-dark': '#a78bfa', radius: '6', 'border-color': '#c4b5fd', 'border-color-dark': '#4c1d95' }]],
      ['Neutral', [{ neutral: '' }]],
    ]
    const main = document.getElementById('main')
    for (const [title, variants] of groups) {
      const section = document.createElement('section')
      section.innerHTML = '<h2></h2><div class="row"></div>'
      section.querySelector('h2').textContent = title
      for (const attrs of variants) {
        const el = document.createElement('livck-status')
        el.className = 'live'
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v)
        section.querySelector('.row').append(el)
      }
      main.append(section)
    }
    for (const el of document.querySelectorAll('.live')) el.setAttribute('host', host)
  </script>
  <script src="../dist/embed.js" defer></script>
</body>
</html>
